<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Principios del Autocuidado – Actividad</title>
<!-- Main stylesheet generated by Tailwind build -->
<link href="./content/tailwind_output.css" rel="stylesheet"/>
<!-- Font-Awesome for icons used by the interface layer -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"></script>
<!-- MathJax (kept for consistency with the rest of the handbook even if not required here) -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<!-- Page identifier used by the framework (DON’T REMOVE) -->
<meta content="10_1" name="page-section-id"/>
</head>
<body class="bg-white lg:p-5 md:p-5 sm:p-0 mb-12 font-sans text-lg">
<!-- The reusable interface and navigation containers injected by base.js -->
<div id="interface-container"></div>
<div id="nav-container"></div>
<main class="container content mx-auto bg-white mt-auto p-5 rounded-lg lg:px-24 md:px-12 sm:px-6" id="content">
<!-- ACTIVITY: Multiple-choice -->
<section aria-labelledby="question-label" class="space-y-6" data-section-type="activity_multiple_choice" id="mc-section" role="activity">
<!-- Question header -->
<header>
<h1 class="text-4xl font-bold text-pink-500 mb-4" data-id="text-10-7" id="question-label">
            ¿Cuál de los siguientes enunciados describe mejor un principio de
            autocuidado?
          </h1>
<p class="mb-2 text-gray-700" data-id="text-10-8">
            ¡Elige la respuesta correcta y luego pulsa
            <strong data-id="text-10-9">Enviar</strong> en la barra inferior!
          </p>
</header>
<!-- Options wrapper (treated as a radio-group by the JS helper) -->
<div class="flex flex-col gap-4" data-area-id="default" role="group">
<!-- Option A -->
<label class="activity-option flex items-start p-4 border border-gray-300 rounded-lg" data-activity-item="opA">
<!-- Letter circle -->
<div class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center mr-4">
<span class="option-letter text-gray-500" data-id="text-10-10">A</span>
</div>
<!-- Radio (screen-reader only, state controlled by JS) -->
<input class="sr-only" name="mc-question" type="radio" value="A"/>
<!-- Option text -->
<span class="flex-1" data-id="text-10-11">Ignorar las señales de tu cuerpo cuando estás cansado.</span>
<!-- Feedback placeholder (shown after validar) -->
<div class="feedback-container hidden ml-4 flex items-center space-x-2">
<span class="feedback-icon"></span>
<span class="feedback-text"></span>
</div>
</label>
<!-- Option B (correct) -->
<label class="activity-option flex items-start p-4 border border-gray-300 rounded-lg" data-activity-item="opB">
<div class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center mr-4">
<span class="option-letter text-gray-500" data-id="text-10-12">B</span>
</div>
<input class="sr-only" name="mc-question" type="radio" value="B"/>
<span class="flex-1" data-id="text-10-13">Reconocer tus necesidades y buscar tiempo para descansar y
              recargar energía.</span>
<div class="feedback-container hidden ml-4 flex items-center space-x-2">
<span class="feedback-icon"></span>
<span class="feedback-text"></span>
</div>
</label>
<!-- Option C -->
<label class="activity-option flex items-start p-4 border border-gray-300 rounded-lg" data-activity-item="opC">
<div class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center mr-4">
<span class="option-letter text-gray-500" data-id="text-10-14">C</span>
</div>
<input class="sr-only" name="mc-question" type="radio" value="C"/>
<span class="flex-1" data-id="text-10-15">Priorizar siempre las tareas escolares sobre tu bienestar físico
              y emocional.</span>
<div class="feedback-container hidden ml-4 flex items-center space-x-2">
<span class="feedback-icon"></span>
<span class="feedback-text"></span>
</div>
</label>
</div>
</section>
</main>
<!-- Framework scripts -->
<script src="./assets/modules/state.js" type="module"></script>
<script src="./assets/base.js" type="module"></script>
<!-- Page-specific answers configuration (must be loaded BEFORE activity.js validation) -->
<script>
      // Mapeo de respuestas correctas (clave = data-activity-item, valor = true/false)
      var correctAnswers = {
        opA: false,
        opB: true, // Opción correcta
        opC: false,
      };
    </script>
<!-- El engine de actividades ya se importa indirectamente a través de base.js -->
</body>
</html>
